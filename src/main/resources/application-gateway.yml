spring:
  config:
    import: configtree:${LOOKAHEAD_SECRETS_DIRECTORY:/run/secrets/}
  flyway:
    enabled: false
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: LOOKAHEAD_GATEWAY
        http-only: true
        secure: true
        same-site: lax
app:
  oauth:
    issuer: ${LOOKAHEAD_OAUTH_ISSUER}
    frontend: ${LOOKAHEAD_FRONTEND_ORIGIN}
    upstream: ${LOOKAHEAD_API_UPSTREAM:http://content-api:8080}
