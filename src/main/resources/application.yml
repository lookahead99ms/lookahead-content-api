spring:
  application:
    name: interview-guide-backend
  profiles:
    default: local

app:
  version: "@project.version@"
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
