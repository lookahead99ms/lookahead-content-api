spring:
  application:
    name: lookahead-content-api
  profiles:
    default: local
    group:
      local-accounts:
        - local
        - accounts
        - local-test
      dev:
        - accounts
      production:
        - prod
        - accounts

app:
  version: "@project.version@"
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
